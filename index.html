<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYXONGPT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050507;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#09090d;
    border-right:1px solid #24242d;
    padding:15px;
    display:flex;
    flex-direction:column;
    transition:.3s;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:#a855f7;
    margin-bottom:20px;
    text-align:center;
    letter-spacing:1px;
}

.new-chat{
    border:1px solid #34343f;
    background:#111117;
    color:white;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    margin-bottom:18px;
}

.new-chat:hover{
    background:#191923;
}

.history-title{
    color:#777783;
    font-size:12px;
    margin:5px 8px 10px;
}

.history{
    overflow:auto;
}

.history-item{
    padding:11px;
    border-radius:10px;
    color:#bdbdc7;
    margin-bottom:4px;
    cursor:pointer;
    font-size:14px;
}

.history-item:hover{
    background:#15151d;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:60px;
    border-bottom:1px solid #22222a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#08080b;
}

.brand{
    font-size:18px;
    font-weight:bold;
}

.brand span{
    color:#a855f7;
}

.menu-btn{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:25px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px 15px 150px;
}

.welcome{
    max-width:750px;
    margin:80px auto 0;
    text-align:center;
}

.welcome h1{
    font-size:42px;
    margin-bottom:12px;
    background:linear-gradient(90deg,#fff,#a855f7,#7c3aed);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    color:#8d8d98;
    margin-bottom:30px;
}

.suggestions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.suggestion{
    background:#0e0e14;
    border:1px solid #272732;
    color:#ddd;
    border-radius:13px;
    padding:15px;
    cursor:pointer;
    text-align:left;
}

.suggestion:hover{
    border-color:#8b5cf6;
}

/* MESSAGES */

.message{
    max-width:850px;
    margin:0 auto 20px;
    display:flex;
    gap:10px;
}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#7c3aed;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-weight:bold;
}

.message.ai .avatar{
    background:#171720;
    border:1px solid #34343e;
}

.bubble{
    max-width:75%;
    padding:12px 15px;
    border-radius:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.user .bubble{
    background:#6d28d9;
}

.ai .bubble{
    background:#111118;
    border:1px solid #272731;
}

/* ATTACHMENT */

.attachment-preview{
    max-width:850px;
    margin:0 auto 8px;
}

.attachment-card{
    display:flex;
    align-items:center;
    gap:10px;
    background:#111118;
    border:1px solid #30303b;
    padding:8px;
    border-radius:12px;
}

.attachment-card img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
}

.file-info{
    flex:1;
    overflow:hidden;
}

.file-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-type{
    color:#777783;
    font-size:11px;
}

.remove-file{
    border:0;
    background:#292932;
    color:white;
    width:30px;
    height:30px;
    border-radius:8px;
    cursor:pointer;
}

/* TYPING */

.typing{
    display:flex;
    gap:4px;
    padding:5px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#aaa;
    animation:typing 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,100%{opacity:.2}
    50%{opacity:1}
}

/* INPUT */

.input-area{
    position:fixed;
    bottom:0;
    left:260px;
    right:0;
    padding:12px 15px 18px;
    background:linear-gradient(transparent,#050507 25%);
}

.input-box{
    max-width:850px;
    margin:auto;
    background:#101016;
    border:1px solid #30303b;
    border-radius:18px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:6px;
}

.tool-btn,
.send-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:#191922;
    color:white;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
}

.tool-btn:hover{
    background:#272733;
}

.send-btn{
    background:#7c3aed;
}

.send-btn:hover{
    background:#8b5cf6;
}

#messageInput{
    flex:1;
    background:transparent;
    border:0;
    outline:none;
    color:white;
    font-size:15px;
    min-width:0;
}

#messageInput::placeholder{
    color:#70707b;
}

.hidden{
    display:none;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        position:fixed;
        left:-270px;
        top:0;
        bottom:0;
        z-index:100;
    }

    .sidebar.open{
        left:0;
    }

    .menu-btn{
        display:block;
    }

    .input-area{
        left:0;
    }

    .welcome{
        margin-top:60px;
    }

    .welcome h1{
        font-size:32px;
    }

    .suggestions{
        grid-template-columns:1fr;
    }

    .bubble{
        max-width:85%;
    }

    .chat{
        padding-bottom:145px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="logo">RYXONGPT</div>

    <button class="new-chat" onclick="newChat()">
        ＋ New Chat
    </button>

    <div class="history-title">CHAT HISTORY</div>

    <div class="history" id="history"></div>

</aside>

<!-- MAIN -->

<main class="main">

    <header class="topbar">

        <button class="menu-btn" onclick="toggleSidebar()">☰</button>

        <div class="brand">
            RYXON<span>GPT</span>
        </div>

        <div>✦</div>

    </header>

    <section class="chat" id="chat">

        <div class="welcome" id="welcome">

            <h1>RYXONGPT</h1>

            <p>
                Your personal AI-style assistant.
            </p>

            <div class="suggestions">

                <button class="suggestion"
                    onclick="suggest('Give me a Roblox game idea')">
                    🎮 Roblox game idea
                </button>

                <button class="suggestion"
                    onclick="suggest('Help me create a website')">
                    🌐 Create a website
                </button>

                <button class="suggestion"
                    onclick="suggest('Give me a cool gaming name')">
                    👾 Gaming name
                </button>

                <button class="suggestion"
                    onclick="suggest('Write me a cool bio')">
                    ✨ Cool bio
                </button>

            </div>

        </div>

    </section>

</main>

<!-- INPUT -->

<div class="input-area">

    <div class="attachment-preview" id="attachmentPreview"></div>

    <div class="input-box">

        <!-- CAMERA -->
        <button class="tool-btn"
                onclick="openCamera()"
                title="Camera">
            📷
        </button>

        <!-- PHOTO -->
        <button class="tool-btn"
                onclick="openPhoto()"
                title="Photo">
            🖼️
        </button>

        <!-- FILE -->
        <button class="tool-btn"
                onclick="openFile()"
                title="File">
            📎
        </button>

        <!-- VOICE -->
        <button class="tool-btn"
                onclick="startVoice()"
                title="Voice">
            🎤
        </button>

        <input
            id="messageInput"
            type="text"
            placeholder="Message RYXONGPT..."
            autocomplete="off"
        >

        <button class="send-btn"
                onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>

</div>


<!-- HIDDEN INPUTS -->

<input
    id="cameraInput"
    class="hidden"
    type="file"
    accept="image/*"
    capture="environment"
    onchange="handleAttachment(this)"
>

<input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
    onchange="handleAttachment(this)"
>

<input
    id="fileInput"
    class="hidden"
    type="file"
    accept="*/*"
    onchange="handleAttachment(this)"
>


<script>

let selectedAttachment = null;
let chatStarted = false;


/* SIDEBAR */

function toggleSidebar(){
    document.getElementById("sidebar")
        .classList.toggle("open");
}


/* NEW CHAT */

function newChat(){

    const chat = document.getElementById("chat");

    chat.innerHTML = `
        <div class="welcome" id="welcome">

            <h1>RYXONGPT</h1>

            <p>
                What can I help you with?
            </p>

            <div class="suggestions">

                <button class="suggestion"
                    onclick="suggest('Give me a Roblox game idea')">
                    🎮 Roblox game idea
                </button>

                <button class="suggestion"
                    onclick="suggest('Help me create a website')">
                    🌐 Create a website
                </button>

                <button class="suggestion"
                    onclick="suggest('Give me a cool gaming name')">
                    👾 Gaming name
                </button>

                <button class="suggestion"
                    onclick="suggest('Write me a cool bio')">
                    ✨ Cool bio
                </button>

            </div>

        </div>
    `;

    selectedAttachment = null;

    document.getElementById("attachmentPreview")
        .innerHTML = "";

    document.getElementById("messageInput")
        .value = "";
}


/* SUGGESTION */

function suggest(text){

    document.getElementById("messageInput").value = text;

    sendMessage();
}


/* CAMERA */

function openCamera(){

    document.getElementById("cameraInput").click();

}


/* PHOTO */

function openPhoto(){

    document.getElementById("photoInput").click();

}


/* FILE */

function openFile(){

    document.getElementById("fileInput").click();

}


/* ATTACHMENT */

function handleAttachment(input){

    if(!input.files || !input.files[0]){
        return;
    }

    selectedAttachment = input.files[0];

    showAttachment(selectedAttachment);

    input.value = "";
}


/* SHOW ATTACHMENT */

function showAttachment(file){

    const preview =
        document.getElementById("attachmentPreview");

    preview.innerHTML = "";

    const card =
        document.createElement("div");

    card.className = "attachment-card";

    const info =
        document.createElement("div");

    info.className = "file-info";

    const name =
        document.createElement("div");

    name.className = "file-name";

    name.textContent = file.name;

    const type =
        document.createElement("div");

    type.className = "file-type";

    type.textContent =
        file.type || "File";

    info.appendChild(name);
    info.appendChild(type);

    const remove =
        document.createElement("button");

    remove.className = "remove-file";

    remove.textContent = "×";

    remove.onclick = function(){

        selectedAttachment = null;

        preview.innerHTML = "";

    };

    if(file.type.startsWith("image/")){

        const img =
            document.createElement("img");

        img.src =
            URL.createObjectURL(file);

        card.appendChild(img);

    }

    card.appendChild(info);
    card.appendChild(remove);

    preview.appendChild(card);
}


/* SEND */

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text && !selectedAttachment){
        return;
    }

    const welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    let attachment = selectedAttachment;

    addMessage(
        "user",
        text,
        attachment
    );

    input.value = "";

    selectedAttachment = null;

    document.getElementById("attachmentPreview")
        .innerHTML = "";

    saveHistory(text || "Attachment");

    showTyping();

    setTimeout(function(){

        removeTyping();

        const reply =
            generateReply(text);

        addMessage(
            "ai",
            reply
        );

    },900);

}


/* ADD MESSAGE */

function addMessage(type,text,attachment=null){

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        type === "user" ? "U" : "R";

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    if(text){
        bubble.textContent = text;
    }

    if(attachment){

        if(attachment.type.startsWith("image/")){

            const img =
                document.createElement("img");

            img.src =
                URL.createObjectURL(attachment);

            img.style.maxWidth = "230px";
            img.style.maxHeight = "250px";
            img.style.borderRadius = "10px";
            img.style.display = "block";
            img.style.marginTop =
                text ? "10px" : "0";

            bubble.appendChild(img);

        }else{

            const fileBox =
                document.createElement("div");

            fileBox.style.marginTop =
                text ? "10px" : "0";

            fileBox.textContent =
                "📎 " + attachment.name;

            bubble.appendChild(fileBox);
        }
    }

    message.appendChild(avatar);
    message.appendChild(bubble);

    if(type === "user"){
        message.innerHTML = "";
        message.appendChild(bubble);
        message.appendChild(avatar);
    }

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* TYPING */

function showTyping(){

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "typingMessage";

    message.innerHTML = `
        <div class="avatar">R</div>

        <div class="bubble">

            <div class="typing">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

        </div>
    `;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function removeTyping(){

    const typing =
        document.getElementById("typingMessage");

    if(typing){
        typing.remove();
    }
}


/* BASIC AI DEMO */

function generateReply(text){

    const t =
        (text || "").toLowerCase();

    if(t.includes("roblox")){

        return "🎮 RYXONGPT idea:\n\nCreate a fast Roblox escape game with checkpoints, coins, speed upgrades and random events.\n\nIf you want, you can build it completely from Roblox Studio Lite.";

    }

    if(t.includes("website") ||
       t.includes("html")){

        return "🌐 I can help you build an HTML website.\n\nRYXONGPT can make a mobile-friendly dark/purple design with buttons, animations, sections and effects.";

    }

    if(t.includes("name")){

        return "👾 Some dark gaming names:\n\nONYX\nRYXON\nVANTA\nUMBRA\nVOID\nGRIM\nVEIL\nCRYPT";

    }

    if(t.includes("bio")){

        return "🖤 RYXON RBX\n🎮 Roblox Creator\n⚡ Gaming & Scripts\n🌑 Dark Style\n🚀 Road to 100 Subscribers";

    }

    if(t.includes("hello") ||
       t.includes("hi") ||
       t.includes("barev")){

        return "👋 Barev! Ես RYXONGPT-ն եմ։ Ինչո՞վ օգնեմ քեզ։";

    }

    return "🤖 RYXONGPT-ը պատրաստ է օգնել։\n\nԳրիր ինչ ես ուզում ստեղծել, և ես կփորձեմ օգնել քայլ առ քայլ։";

}


/* VOICE */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice input-ը այս browser-ում չի աջակցվում։"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "hy-AM";

    recognition.interimResults = false;

    recognition.continuous = false;

    recognition.onstart = function(){

        document.getElementById("messageInput")
            .placeholder =
            "Listening... 🎤";

    };

    recognition.onresult = function(event){

        const result =
            event.results[0][0].transcript;

        document.getElementById("messageInput")
            .value = result;

    };

    recognition.onend = function(){

        document.getElementById("messageInput")
            .placeholder =
            "Message RYXONGPT...";

    };

    recognition.onerror = function(){

        document.getElementById("messageInput")
            .placeholder =
            "Message RYXONGPT...";

    };

    recognition.start();
}


/* ENTER */

document.getElementById("messageInput")
    .addEventListener("keydown",function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    });


/* HISTORY */

function saveHistory(text){

    if(!text){
        return;
    }

    const history =
        document.getElementById("history");

    const item =
        document.createElement("
