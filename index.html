<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini App UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0e0e0e; color: #e3e3e3; height: 100vh; display: flex; overflow: hidden; }

    /* Overlay Sidebar */
    .sidebar {
      width: 280px;
      background-color: #171717;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      border-right: 1px solid #222;
    }
    .sidebar-top { display: flex; flex-direction: column; gap: 20px; }
    .app-title { font-size: 20px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { cursor: pointer; font-size: 18px; color: #aaa; }
    
    .menu-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .menu-item { display: flex; align-items: center; gap: 12px; font-size: 15px; color: #e3e3e3; cursor: pointer; }
    
    .section-title { font-size: 12px; color: #888; margin-top: 15px; margin-bottom: 5px; }
    .recent-list { list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 250px; }
    .recent-item { 
      padding: 10px 12px; 
      border-radius: 20px; 
      font-size: 14px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      cursor: pointer; 
    }
    .recent-item.active { background-color: #212121; }

    .profile-section { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #222; }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #444; }
    .plan-btn { background: #1b3bbb; color: #fff; border: none; padding: 8px 14px; border-radius: 18px; font-size: 12px; cursor: pointer; }

    /* Main Container */
    .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0e0e0e; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .menu-icon { font-size: 20px; cursor: pointer; }
    .model-selector { background: transparent; color: #e3e3e3; border: none; font-size: 16px; font-weight: 500; outline: none; cursor: pointer; }

    /* Chat Area */
    .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .user { background-color: #282a2c; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background-color: transparent; align-self: flex-start; padding-left: 0; }

    /* Bottom Input Bar */
    .input-wrapper { padding: 12px 16px; background: #0e0e0e; }
    .input-bar { 
      background: #1e1e1e; 
      border-radius: 28px; 
      display: flex; 
      align-items: center; 
      padding: 8px 16px; 
      gap: 10px; 
    }
    .add-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
    input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 15px; }
    .action-btns { display: flex; align-items: center; gap: 10px; }
    .circle-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #282a2c; color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .send-icon-btn { background: #3b52d4; }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="app-title">
        <span>Gemini</span>
        <span class="close-btn">✕</span>
      </div>
      <ul class="menu-list">
        <li class="menu-item" onclick="newChat()">✏️ Новый чат</li>
        <li class="menu-item">🔍 Поиск по чатам</li>
        <li class="menu-item">🎬 Видео</li>
        <li class="menu-item">🗂️ Библиотека</li>
      </ul>
      <div class="section-title">Недавние</div>
      <ul class="recent-list" id="recentList">
        <li class="recent-item active">Barevner ev ognutyun</li>
        <li class="recent-item">English: Friendly Greeting</li>
        <li class="recent-item">Գիթհաբում Գեմինիի նման...</li>
      </ul>
    </div>
    
    <div class="profile-section">
      <div class="user-info">
        <div class="avatar"></div>
        <span>User</span>
      </div>
      <button class="plan-btn">Сменить план</button>
    </div>
  </div>

  <!-- Main View -->
  <div class="main-container">
    <header>
      <div class="header-left">
        <span class="menu-icon">☰</span>
        <select class="model-selector" id="modelSelect">
          <option value="gemini-2.5-flash">Gemini Flash ⌵</option>
          <option value="gemini-2.5-pro">Gemini Pro ⌵</option>
        </select>
      </div>
      <div>⋮</div>
    </header>

    <div class="chat-area" id="chatBox"></div>

    <div class="input-wrapper">
      <div class="input-bar">
        <button class="add-btn">+</button>
        <input type="text" id="userInput" placeholder="Спросить..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <div class="action-btns">
          <button class="circle-btn">🎙️</button>
          <button class="circle-btn send-icon-btn" onclick="sendMessage()">➔</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6JgdeYuuWb8MyI7VSCSdvJhBeNDLXOIH_EyVCU9iv7Gpw";

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const selectedModel = document.getElementById('modelSelect').value;

      appendMessage(text, 'user');
      input.value = '';

      const botMsgDiv = appendMessage("Thinking...", 'bot');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          botMsgDiv.textContent = "Error: " + data.error.message;
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
          botMsgDiv.textContent = reply;
        }
      } catch (err) {
        botMsgDiv.textContent = "Error connecting to the API.";
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function newChat() {
      document.getElementById('chatBox').innerHTML = '';
    }
  </script>
</body>
</html>
