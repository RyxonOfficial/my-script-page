<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Lab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: #00ff66;
  font-family: monospace;
  overflow: hidden;
}

#loader {
  position: fixed;
  inset: 0;
  background: #050505;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.logo {
  font-size: 32px;
  margin-bottom: 25px;
  text-shadow: 0 0 15px #00ff66;
}

.bar {
  width: 80%;
  max-width: 500px;
  height: 18px;
  border: 1px solid #00ff66;
  padding: 3px;
}

.progress {
  width: 0%;
  height: 100%;
  background: #00ff66;
  box-shadow: 0 0 15px #00ff66;
}

#percent {
  margin-top: 12px;
  font-size: 20px;
}

#status {
  margin-top: 8px;
  color: #aaa;
}

#main {
  display: none;
  min-height: 100vh;
  padding: 30px;
}

h1 {
  text-shadow: 0 0 15px #00ff66;
}

.panel {
  border: 1px solid #00ff66;
  padding: 20px;
  margin-top: 25px;
  max-width: 700px;
  box-shadow: 0 0 20px #003d19;
}

button {
  background: transparent;
  color: #00ff66;
  border: 1px solid #00ff66;
  padding: 12px 20px;
  cursor: pointer;
  font-family: monospace;
}

button:hover {
  background: #00ff66;
  color: #000;
}
</style>
</head>

<body>

<div id="loader">
  <div class="logo">[ CYBER LAB ]</div>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>

  <div id="percent">0%</div>
  <div id="status">Initializing...</div>
</div>

<div id="main">
  <h1>CYBER LAB</h1>

  <div class="panel">
    <p>> SYSTEM STATUS: ONLINE</p>
    <p>> SECURITY MODE: DEMO</p>
    <p>> CONNECTION: SAFE</p>
    <br>

    <button onclick="startChallenge()">
      START CHALLENGE
    </button>

    <p id="result"></p>
  </div>
</div>

<script>
let progress = 0;

const progressBar = document.getElementById("progress");
const percent = document.getElementById("percent");
const status = document.getElementById("status");

const messages = [
  "Initializing...",
  "Loading security modules...",
  "Checking demo environment...",
  "Starting cyber lab...",
  "Finalizing..."
];

const timer = setInterval(() => {
  progress++;

  progressBar.style.width = progress + "%";
  percent.textContent = progress + "%";

  if (progress % 20 === 0) {
    status.textContent =
      messages[Math.min(progress / 20, messages.length - 1)];
  }

  if (progress >= 100) {
    clearInterval(timer);

    setTimeout(() => {
      document.getElementById("loader").style.display = "none";
      document.getElementById("main").style.display = "block";
      document.body.style.overflow = "auto";
    }, 500);
  }
}, 35);

function startChallenge() {
  document.getElementById("result").textContent =
    "> Demo challenge activated. Good luck!";
}
</script>

</body>
</html>
