<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyxonGemini Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { 
      background: linear-gradient(135deg, #090714, #120e24, #05040a); 
      color: #e2e8f0; 
      height: 100vh; 
      display: flex; 
      overflow: hidden; 
      position: relative;
    }

    /* Overlay Sidebar (Hidden by default) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100%;
      background: rgba(18, 14, 36, 0.95);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 10px 0 30px rgba(0,0,0,0.6);
      transition: left 0.3s ease;
      z-index: 100;
    }
    .sidebar.active { left: 0; }

    .sidebar-top { display: flex; flex-direction: column; gap: 20px; }
    .app-title { font-size: 20px; font-weight: bold; color: #00f2fe; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { cursor: pointer; font-size: 20px; color: #a0aec0; transition: 0.2s; }
    .close-btn:hover { color: #fff; }

    .menu-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .menu-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      font-size: 15px; 
      color: #e2e8f0; 
      padding: 10px 14px; 
      border-radius: 10px; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .menu-item:hover { background: rgba(255, 255, 255, 0.08); color: #00f2fe; }

    .section-title { font-size: 12px; color: #718096; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .recent-list { list-style: none; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 220px; }
    .recent-item { 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-size: 14px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      cursor: pointer; 
      color: #cbd5e0;
      transition: 0.2s;
    }
    .recent-item:hover, .recent-item.active { background: rgba(121, 40, 202, 0.3); color: #fff; }

    .profile-section { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #7928ca, #00f2fe); }
    .plan-btn { background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }

    /* Backdrop Dimmer */
    .backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 90;
    }
    .backdrop.active { display: block; }

    /* Main App Area */
    .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
    
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 14px 18px; 
      background: rgba(18, 14, 36, 0.7); 
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .menu-icon { font-size: 22px; cursor: pointer; color: #00f2fe; }

    /* Model Dropdown Selector */
    .model-selector { 
      background: #18132e; 
      color: #e2e8f0; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      font-size: 15px; 
      font-weight: 600; 
      padding: 6px 12px; 
      border-radius: 10px; 
      outline: none; 
      cursor: pointer; 
    }

    .more-options-btn { cursor: pointer; font-size: 20px; color: #a0aec0; }

    /* Chat Messages Box */
    .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg { 
      max-width: 80%; 
      padding: 12px 18px; 
      border-radius: 16px; 
      font-size: 15px; 
      line-height: 1.5; 
      word-break: break-word; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .user { 
      background: linear-gradient(135deg, #7928ca, #4338ca); 
      color: #ffffff;
      align-self: flex-end; 
      border-bottom-right-radius: 4px;
    }
    .bot { 
      background: #18132e; 
      color: #e2e8f0;
      align-self: flex-start; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-bottom-left-radius: 4px;
    }

    /* Bottom Input Area */
    .input-wrapper { padding: 14px 18px; background: rgba(18, 14, 36, 0.8); position: relative; }
    .input-bar { 
      background: #18132e; 
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px; 
      display: flex; 
      align-items: center; 
      padding: 6px 14px; 
      gap: 10px; 
    }
    .add-btn { 
      background: #251d45; 
      border: none; 
      color: #00f2fe; 
      width: 36px; 
      height: 36px; 
      border-radius: 50%; 
      font-size: 22px; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      transition: 0.2s;
    }
    .add-btn:hover { background: #33285c; }

    input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 15px; }
    
    .action-btns { display: flex; align-items: center; gap: 8px; }
    .circle-btn { 
      width: 38px; height: 38px; 
      border-radius: 50%; 
      border: none; 
      background: #251d45; 
      color: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      cursor: pointer; 
      font-size: 16px;
      transition: 0.2s;
    }
    .circle-btn:hover { background: #33285c; }
    .send-icon-btn { background: linear-gradient(135deg, #4f46e5, #06b6d4); font-weight: bold; }

    /* Media Attach Popup Frame */
    .media-frame {
      position: absolute;
      bottom: 75px;
      left: 20px;
      background: #18132e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 50;
      width: 180px;
    }
    .media-frame.active { display: flex; }
    .media-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .media-item:hover { background: rgba(255, 255, 255, 0.1); color: #00f2fe; }

    /* Payment Modal for Gemini Pro ($2) */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #18132e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px;
      width: 320px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 20px; font-weight: bold; color: #00f2fe; margin-bottom: 10px; }
    .price-tag { font-size: 28px; font-weight: bold; color: #fff; margin: 15px 0; }
    .pay-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7928ca, #00f2fe);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .cancel-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <!-- Left Sidebar Menu -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="app-title">
        <span>Gemini</span>
        <span class="close-btn" onclick="closeSidebar()">✕</span>
      </div>
      <ul class="menu-list">
        <li class="menu-item" onclick="newChat()">✏️ Новый чат</li>
        <li class="menu-item" onclick="searchChats()">🔍 Поиск по чатам</li>
        <li class="menu-item" onclick="openFeature('Видео')">🎬 Видео</li>
        <li class="menu-item" onclick="openFeature('Библиотека')">🗂️ Библиотека</li>
      </ul>
      <div class="section-title">Недавние</div>
      <ul class="recent-list">
        <li class="recent-item active" onclick="loadChat('Barevner ev ognutyun')">Barevner ev ognutyun</li>
        <li class="recent-item" onclick="loadChat('English: Friendly Greeting')">English: Friendly Greeting</li>
        <li class="recent-item" onclick="loadChat('Գիթհաբում Գեմինիի նման...')">Գիթհաբում Գեմինիի նման...</li>
      </ul>
    </div>
    
    <div class="profile-section">
      <div class="user-info">
        <div class="avatar"></div>
        <span>User</span>
      </div>
      <button class="plan-btn" onclick="openProModal()">Сменить план</button>
    </div>
  </div>

  <!-- Main Chat Window -->
  <div class="main-container">
    <header>
      <div class="header-left">
        <span class="menu-icon" onclick="openSidebar()">☰</span>
        <select class="model-selector" id="modelSelect" onchange="handleModelChange()">
          <option value="gemini-2.5-flash">Gemini Flash</option>
          <option value="gemini-2.5-pro">Gemini Pro ($2/mo)</option>
        </select>
      </div>
      <div class="more-options-btn" onclick="openFeature('Настройки')">⋮</div>
    </header>

    <div class="chat-area" id="chatBox"></div>

    <div class="input-wrapper">
      <!-- Popup Frame for Media Attachments -->
      <div class="media-frame" id="mediaFrame">
        <div class="media-item" onclick="attachMedia('📷 Фото')">📷 Фото</div>
        <div class="media-item" onclick="attachMedia('🎥 Видео')">🎥 Видео</div>
        <div class="media-item" onclick="attachMedia('📁 Файлы')">📁 Файлы</div>
        <div class="media-item" onclick="attachMedia('🎵 Музыка')">🎵 Музыка</div>
        <div class="media-item" onclick="attachMedia('🎨 Canvas')">🎨 Canvas</div>
      </div>

      <div class="input-bar">
        <button class="add-btn" onclick="toggleMediaFrame()">+</button>
        <input type="text" id="userInput" placeholder="Спросить..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <div class="action-btns">
          <button class="circle-btn" onclick="startVoiceInput()">🎙️</button>
          <button class="circle-btn send-icon-btn" onclick="sendMessage()">➔</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Gemini Pro ($2) Purchase -->
  <div class="modal" id="proModal">
    <div class="modal-content">
      <div class="modal-title">Gemini Pro</div>
      <p style="color: #a0aec0; font-size: 14px;">Բացեք Gemini Pro-ի բոլոր հնարավորությունները:</p>
      <div class="price-tag">$2.00 / ամիս</div>
      <button class="pay-btn" onclick="subscribePro()">Գնել հիմա ($2)</button>
      <button class="cancel-btn" onclick="closeProModal()">Չեղարկել</button>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6JgdeYuuWb8MyI7VSCSdvJhBeNDLXOIH_EyVCU9iv7Gpw";
    let isProSubscribed = false;

    /* Sidebar controls */
    function openSidebar() {
      document.getElementById('sidebar').classList.add('active');
      document.getElementById('backdrop').classList.add('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('backdrop').classList.remove('active');
    }

    /* Media Attach Frame Toggle */
    function toggleMediaFrame() {
      const frame = document.getElementById('mediaFrame');
      frame.classList.toggle('active');
    }

    function attachMedia(type) {
      alert(type + " կցվեց հաղորդագրությանը:");
      toggleMediaFrame();
    }

    /* Model Selection & Pro Subscription Modal */
    function handleModelChange() {
      const select = document.getElementById('modelSelect');
      if (select.value === 'gemini-2.5-pro' && !isProSubscribed) {
        openProModal();
      }
    }

    function openProModal() {
      document.getElementById('proModal').classList.add('active');
    }

    function closeProModal() {
      document.getElementById('proModal').classList.remove('active');
      if (!isProSubscribed) {
        document.getElementById('modelSelect').value = 'gemini-2.5-flash';
      }
    }

    function subscribePro() {
      isProSubscribed = true;
      alert("Շնորհավորում ենք! Դուք ակտիվացրեցիք Gemini Pro ($2):");
      closeProModal();
      document.getElementById('modelSelect').value = 'gemini-2.5-pro';
    }

    /* Chat logic & API integration */
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const selectedModel = document.getElementById('modelSelect').value;

      appendMessage(text, 'user');
      input.value = '';

      // Close media frame if open
      document.getElementById('mediaFrame').classList.remove('active');

      const botMsgDiv = appendMessage("Mtatsum e...", 'bot');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          botMsgDiv.textContent = "Sxal API: " + data.error.message;
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Patasxan chstacvec:";
          botMsgDiv.textContent = reply;
        }
      } catch (err) {
        botMsgDiv.textContent = "Sxal: CHhacoghvec kapvel serveri het:";
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function newChat() {
      document.getElementById('chatBox').innerHTML = '';
      closeSidebar();
    }

    function searchChats() {
      const q = prompt("Որոնել չատերում․");
      if (q) alert("Որոնում: " + q);
      closeSidebar();
    }

    function openFeature(name) {
      alert("Բացվում է " + name + " բաժինը:");
      closeSidebar();
    }

    function loadChat(title) {
      newChat();
      appendMessage("Բեռնված չատ: " + title, 'bot');
      closeSidebar();
    }

    /* Voice Input Feature */
    function startVoiceInput() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Ձեր բրաուզերը չի աջակցում ձայնային մուտք:");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'hy-AM';
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
      };
    }
  </script>
</body>
</html>
