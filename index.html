<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyxonGemini</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { 
      background: linear-gradient(135deg, #0f0c20, #15102a, #060814); 
      color: #fff; 
      margin: 0; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
    }

    /* Header Controls */
    header { 
      background: rgba(20, 15, 38, 0.8); 
      backdrop-filter: blur(10px);
      padding: 12px 16px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    
    .brand { font-size: 18px; font-weight: bold; color: #00f2fe; }

    /* Custom Dropdown Selector */
    select.model-select {
      background: #120e24;
      color: #e2e8f0;
      border: 1px solid #4f46e5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .header-btns { display: flex; gap: 8px; }
    .icon-btn {
      background: #1e1b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .icon-btn:hover { background: #2d264f; }

    /* Chat Area */
    #chat-box { 
      flex: 1; 
      padding: 20px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }
    .msg { 
      max-width: 80%; 
      padding: 12px 18px; 
      border-radius: 16px; 
      font-size: 15px; 
      line-height: 1.5; 
      word-break: break-word; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .user { 
      background: linear-gradient(135deg, #7928ca, #4338ca); 
      color: #ffffff;
      align-self: flex-end; 
      border-bottom-right-radius: 4px;
    }
    .bot { 
      background: #1e1b2e; 
      color: #e2e8f0;
      align-self: flex-start; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-bottom-left-radius: 4px;
    }

    /* Input Controls */
    #input-box { 
      display: flex; 
      padding: 15px; 
      background: rgba(20, 15, 38, 0.9); 
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    input { 
      flex: 1; 
      padding: 14px 18px; 
      background: #120e24; 
      border: 1px solid #2d264f; 
      color: white; 
      border-radius: 10px; 
      outline: none; 
      font-size: 15px;
      transition: 0.3s;
    }
    input:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }
    button.send-btn { 
      padding: 14px 24px; 
      margin-left: 10px; 
      background: linear-gradient(135deg, #4f46e5, #06b6d4); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: bold;
      transition: transform 0.2s, opacity 0.2s;
    }
    button.send-btn:hover { 
      opacity: 0.9;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">✨ RyxonGemini</div>
    <select id="modelSelect" class="model-select">
      <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
      <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
    </select>
    <div class="header-btns">
      <button class="icon-btn" onclick="clearChat()">🗑️ Clear</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div id="input-box">
    <input type="text" id="userInput" placeholder="Grik harcy aystegh..." onkeydown="if(event.key === 'Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">Ugharkel</button>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6JgdeYuuWb8MyI7VSCSdvJhBeNDLXOIH_EyVCU9iv7Gpw";

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const selectedModel = document.getElementById('modelSelect').value;

      appendMessage(text, 'user');
      input.value = '';

      const botMsgDiv = appendMessage("RyxonGemini-n mtatsum e...", 'bot');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          botMsgDiv.textContent = "Sxal API: " + data.error.message;
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Patasxan chstacvec:";
          botMsgDiv.textContent = reply;
        }
      } catch (err) {
        botMsgDiv.textContent = "Sxal: CHhacoghvec kapvel serveri het:";
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function clearChat() {
      document.getElementById('chat-box').innerHTML = '';
    }
  </script>
</body>
</html>
