<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyxonGemini</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e1e1e; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .user { background: #2b5278; align-self: flex-end; }
    .bot { background: #212121; align-self: flex-start; border: 1px solid #333; }
    #input-box { display: flex; padding: 10px; background: #1e1e1e; }
    input { flex: 1; padding: 12px; background: #2a2a2a; border: none; color: white; border-radius: 6px; outline: none; }
    button { padding: 12px 20px; margin-left: 10px; background: #0088cc; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0077b5; }
  </style>
</head>
<body>

  <header>RyxonGemini</header>

  <div id="chat-box"></div>

  <div id="input-box">
    <input type="text" id="userInput" placeholder="Grik harcy aystegh..." onkeydown="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">Ugharkel</button>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6JyOrhlSsjgyQ3rrE-Sp7vm2k1BDfMJCL2dJn8fCJq-Lw";

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      const botMsgDiv = appendMessage("RyxonGemini-n mtatsum e...", 'bot');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sxal teghi unecav:";
        botMsgDiv.textContent = reply;
      } catch (err) {
        botMsgDiv.textContent = "Sxal: CHhacoghvec kapvel RyxonGemini-i het:";
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
