<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #1e1f20;
            display: flex;
            flex-direction: column;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .new-chat-btn {
            background-color: #282a2c;
            color: #e3e3e3;
            border: 1px solid #444746;
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background-color: #333537;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
        }

        .settings-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
        }

        .settings-btn:hover {
            background-color: #282a2c;
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282a2c;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 500;
            color: #a8c7fa;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background-color: #2b2c2f;
            color: #e3e3e3;
            border-radius: 18px 18px 4px 18px;
        }

        .message.ai .message-content {
            background-color: transparent;
            color: #e3e3e3;
        }

        /* Input Area */
        .input-container {
            padding: 16px 24px 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .input-box {
            background-color: #1e1f20;
            border: 1px solid #444746;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 8px 16px 8px 20px;
        }

        .input-box:focus-within {
            border-color: #a8c7fa;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e3e3e3;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 150px;
            height: 24px;
        }

        .send-btn {
            background-color: #a8c7fa;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 8px;
        }

        .send-btn:disabled {
            background-color: #444746;
            cursor: not-allowed;
        }

        /* Modal Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #1e1f20;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            border: 1px solid #444746;
        }

        .modal-content h3 {
            margin-bottom: 16px;
            color: #e3e3e3;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            background-color: #131314;
            border: 1px solid #444746;
            border-radius: 8px;
            color: #e3e3e3;
            margin-bottom: 20px;
            outline: none;
        }

        .modal-content input:focus {
            border-color: #a8c7fa;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel {
            background: transparent;
            border: none;
            color: #c4c7c5;
            padding: 8px 16px;
            cursor: pointer;
        }

        .btn-save {
            background-color: #a8c7fa;
            color: #040e15;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" id="newChatBtn">
            <span>+</span> Նոր Չատ
        </button>
        <div class="chat-history"></div>
        <button class="settings-btn" id="openSettingsBtn">
            ⚙️ Կարգավորումներ
        </button>
    </div>

    <div class="main-chat">
        <div class="header">
            <h2>AI Assistant</h2>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="message ai">
                <div class="message-content">
                    Բարև 👋 Ինչո՞վ կարող եմ օգնել քեզ այսօր:
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Գրիր հարցդ այստեղ..."></textarea>
                <button class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#040e15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Կարգավորումներ</h3>
            <label style="font-size: 12px; color: #c4c7c5; display: block; margin-bottom: 8px;">Gemini API Key</label>
            <input type="password" id="apiKeyInput" placeholder="Տեղադրիր քո Gemini API Key-ը">
            <div class="modal-actions">
                <button class="btn-cancel" id="closeSettingsBtn">Չեղարկել</button>
                <button class="btn-save" id="saveApiKeyBtn">Պահպանել</button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const newChatBtn = document.getElementById('newChatBtn');

        let apiKey = localStorage.getItem('gemini_api_key') || '';

        if (!apiKey) {
            settingsModal.style.display = 'flex';
        } else {
            apiKeyInput.value = apiKey;
        }

        openSettingsBtn.addEventListener('click', () => {
            apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            settingsModal.style.display = 'flex';
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveApiKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                apiKey = key;
                settingsModal.style.display = 'none';
                alert('API Key-ը պահպանվեց:');
            }
        });

        newChatBtn.addEventListener('click', () => {
            messagesContainer.innerHTML = `
                <div class="message ai">
                    <div class="message-content">
                        Բարև 👋 Ինչո՞վ կարող եմ օգնել քեզ այսօր:
                    </div>
                </div>
            `;
        });

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert('Խնդրում ենք նախ մուտքագրել API Key-ը կարգավորումներում:');
                settingsModal.style.display = 'flex';
                return;
            }

            // Append User Message
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = '24px';

            // Append AI Placeholder Message
            const aiMessageElement = appendMessage('ai', 'Մտածում եմ...');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    aiMessageElement.textContent = 'Սխալ: ' + data.error.message;
                } else {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    aiMessageElement.textContent = aiReply;
                }
            } catch (error) {
                aiMessageElement.textContent = 'Ցանցային սխալ: Խնդրում ենք ստուգել կապը կամ API Key-ը:';
            }

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.textContent = text;

            msgDiv.appendChild(contentDiv);
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return contentDiv;
        }

        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
