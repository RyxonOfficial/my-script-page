<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYXON PRANK</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:#00ff66;
  font-family:monospace;
  min-height:100vh;
  overflow:hidden;
}

.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:700px;
  background:#080808;
  border:1px solid #00ff66;
  border-radius:18px;
  padding:25px;
  box-shadow:0 0 30px rgba(0,255,100,.18);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
  text-shadow:0 0 15px #00ff66;
}

.sub{
  text-align:center;
  color:#777;
  margin-bottom:20px;
}

.terminal{
  height:330px;
  background:#000;
  border:1px solid #143b22;
  border-radius:12px;
  padding:15px;
  overflow:hidden;
  font-size:14px;
  line-height:1.7;
}

.line{
  margin-bottom:3px;
}

.warning{
  color:#ff3333;
}

.yellow{
  color:#ffd000;
}

.progressBox{
  margin-top:18px;
  height:20px;
  border:1px solid #00ff66;
  border-radius:20px;
  overflow:hidden;
  display:none;
}

.progress{
  width:0%;
  height:100%;
  background:#00ff66;
  box-shadow:0 0 15px #00ff66;
  transition:width .2s;
}

.status{
  text-align:center;
  margin-top:10px;
  min-height:22px;
}

button{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#00ff66;
  color:#000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.prank{
  display:none;
  text-align:center;
  padding:30px 10px 10px;
}

.prank h1{
  font-size:38px;
  color:#fff;
  margin-bottom:12px;
}

.prank p{
  color:#00ff66;
  font-size:18px;
}

.small{
  margin-top:15px;
  color:#666;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">☠ RYXON TERMINAL</div>
    <div class="sub">Security System • Online</div>

    <div class="terminal" id="terminal">
      <div class="line">> Initializing system...</div>
    </div>

    <div class="progressBox" id="progressBox">
      <div class="progress" id="progress"></div>
    </div>

    <div class="status" id="status">
      Waiting for user...
    </div>

    <button id="startBtn" onclick="startPrank()">
      ⚡ START SYSTEM SCAN
    </button>

    <div class="prank" id="prank">
      <h1>😂 PRANK!</h1>
      <p>Nothing was hacked.</p>
      <div class="small">
        This was only a harmless fake terminal demo 😈
      </div>
    </div>

  </div>

</div>

  terminal.scrollTop = terminal.scrollHeight;
}

  return new Promise(resolve => setTimeout(resolve,ms));
