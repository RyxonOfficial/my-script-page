<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYXONGPT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050507;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#09090d;
    border-right:1px solid #24242d;
    padding:15px;
    display:flex;
    flex-direction:column;
    transition:.3s;
    z-index:100;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:#a855f7;
    margin-bottom:20px;
    text-align:center;
    letter-spacing:1px;
}

.new-chat{
    border:1px solid #34343f;
    background:#111117;
    color:white;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    margin-bottom:18px;
}

.new-chat:hover{
    background:#191923;
}

.history-title{
    color:#777783;
    font-size:12px;
    margin:5px 8px 10px;
}

.history{
    overflow:auto;
}

.history-item{
    padding:11px;
    border-radius:10px;
    color:#bdbdc7;
    margin-bottom:4px;
    cursor:pointer;
    font-size:14px;
}

.history-item:hover{
    background:#15151d;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:60px;
    border-bottom:1px solid #22222a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#08080b;
}

.brand{
    font-size:18px;
    font-weight:bold;
}

.brand span{
    color:#a855f7;
}

.menu-btn{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:25px;
    cursor:pointer;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px 15px 150px;
}

.welcome{
    max-width:750px;
    margin:80px auto 0;
    text-align:center;
}

.welcome h1{
    font-size:42px;
    margin-bottom:12px;
    background:linear-gradient(90deg,#fff,#a855f7,#7c3aed);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    color:#8d8d98;
    margin-bottom:30px;
}

.suggestions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.suggestion{
    background:#0e0e14;
    border:1px solid #272732;
    color:#ddd;
    border-radius:13px;
    padding:15px;
    cursor:pointer;
    text-align:left;
}

.suggestion:hover{
    border-color:#8b5cf6;
}

/* MESSAGES */

.message{
    max-width:850px;
    margin:0 auto 20px;
    display:flex;
    gap:10px;
}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#7c3aed;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-weight:bold;
}

.message.ai .avatar{
    background:#171720;
    border:1px solid #34343e;
}

.bubble{
    max-width:75%;
    padding:12px 15px;
    border-radius:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.user .bubble{
    background:#6d28d9;
}

.ai .bubble{
    background:#111118;
    border:1px solid #272731;
}

/* ATTACHMENT */

.attachment-preview{
    max-width:850px;
    margin:0 auto 8px;
}

.attachment-card{
    display:flex;
    align-items:center;
    gap:10px;
    background:#111118;
    border:1px solid #30303b;
    padding:8px;
    border-radius:12px;
}

.attachment-card img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:8px;
}

.file-info{
    flex:1;
    overflow:hidden;
}

.file-name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-type{
    color:#777783;
    font-size:11px;
}

.remove-file{
    border:0;
    background:#292932;
    color:white;
    width:30px;
    height:30px;
    border-radius:8px;
    cursor:pointer;
}

/* TYPING */

.typing{
    display:flex;
    gap:4px;
    padding:5px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#aaa;
    animation:typing 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,100%{opacity:.2}
    50%{opacity:1}
}

/* INPUT */

.input-area{
    position:fixed;
    bottom:0;
    left:260px;
    right:0;
    padding:12px 15px 18px;
    background:linear-gradient(transparent,#050507 25%);
    z-index:50;
}

.input-box{
    max-width:850px;
    margin:auto;
    background:#101016;
    border:1px solid #30303b;
    border-radius:18px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:6px;
}

.tool-btn,
.send-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:#191922;
    color:white;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
}

.tool-btn:hover{
    background:#272733;
}

.send-btn{
    background:#7c3aed;
}

.send-btn:hover{
    background:#8b5cf6;
}

#messageInput{
    flex:1;
    background:transparent;
    border:0;
    outline:none;
    color:white;
    font-size:15px;
    min-width:0;
}

#messageInput::placeholder{
    color:#70707b;
}

.hidden{
    display:none;
}

/* PLUS MENU */

.plus-wrapper{
    position:relative;
}

.plus-menu{
    position:absolute;
    bottom:52px;
    left:0;
    width:210px;
    background:#202020;
    border:1px solid #36363d;
    border-radius:18px;
    padding:8px;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
    display:none;
    z-index:200;
}

.plus-menu.open{
    display:block;
}

.plus-item{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    padding:13px 10px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.plus-item:hover{
    background:#303038;
}

.plus-icon{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#34343b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        position:fixed;
        left:-270px;
        top:0;
        bottom:0;
    }

    .sidebar.open{
        left:0;
    }

    .menu-btn{
        display:block;
    }

    .input-area{
        left:0;
    }

    .welcome{
        margin-top:60px;
    }

    .welcome h1{
        font-size:32px;
    }

    .suggestions{
        grid-template-columns:1fr;
    }

    .bubble{
        max-width:85%;
    }

    .chat{
        padding-bottom:145px;
    }

    .plus-menu{
        left:-5px;
        bottom:52px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="logo">RYXONGPT</div>

    <button class="new-chat" onclick="newChat()">
        ＋ New Chat
    </button>

    <div class="history-title">
        CHAT HISTORY
    </div>

    <div class="history" id="history"></div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="topbar">

        <button class="menu-btn"
                onclick="toggleSidebar()">
            ☰
        </button>

        <div class="brand">
            RYXON<span>GPT</span>
        </div>

        <div>✦</div>

    </header>


    <!-- CHAT -->

    <section class="chat" id="chat">

        <div class="welcome" id="welcome">

            <h1>RYXONGPT</h1>

            <p>
                Your personal AI-style assistant.
            </p>

            <div class="suggestions">

                <button class="suggestion"
                    onclick="suggest('Give me a Roblox game idea')">
                    🎮 Roblox game idea
                </button>

                <button class="suggestion"
                    onclick="suggest('Help me create a website')">
                    🌐 Create a website
                </button>

                <button class="suggestion"
                    onclick="suggest('Give me a cool gaming name')">
                    👾 Gaming name
                </button>

                <button class="suggestion"
                    onclick="suggest('Give me YouTube Shorts ideas')">
                    📺 YouTube Shorts
                </button>

            </div>

        </div>

    </section>

</main>


<!-- INPUT -->

<div class="input-area">

    <div class="attachment-preview"
         id="attachmentPreview">
    </div>


    <div class="input-box">


        <!-- PLUS -->

        <div class="plus-wrapper">

            <button class="tool-btn"
                    onclick="togglePlusMenu()">
                ＋
            </button>


            <div class="plus-menu"
                 id="plusMenu">

                <button class="plus-item"
                        onclick="openCamera()">

                    <span class="plus-icon">
                        📷
                    </span>

                    <span>Camera</span>

                </button>


                <button class="plus-item"
                        onclick="openPhoto()">

                    <span class="plus-icon">
                        🖼️
                    </span>

                    <span>Photo</span>

                </button>


                <button class="plus-item"
                        onclick="openFile()">

                    <span class="plus-icon">
                        📎
                    </span>

                    <span>Files</span>

                </button>


                <button class="plus-item"
                        onclick="pluginsMessage()">

                    <span class="plus-icon">
                        🔌
                    </span>

                    <span>Plugins</span>

                </button>


                <button class="plus-item"
                        onclick="deepThink()">

                    <span class="plus-icon">
                        🧠
                    </span>

                    <span>Think deeper</span>

                </button>

            </div>

        </div>


        <!-- VOICE -->

        <button class="tool-btn"
                onclick="startVoice()"
                title="Voice">

            🎤

        </button>


        <!-- MESSAGE -->

        <input
            id="messageInput"
            type="text"
            placeholder="Message RYXONGPT..."
            autocomplete="off"
        >


        <!-- SEND -->

        <button class="send-btn"
                onclick="sendMessage()"
                title="Message">

            💬

        </button>

    </div>

</div>

</div>


<!-- HIDDEN INPUTS -->

<input
    id="cameraInput"
    class="hidden"
    type="file"
    accept="image/*"
    capture="environment"
    onchange="handleAttachment(this)"
>

<input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
    onchange="handleAttachment(this)"
>

<input
    id="fileInput"
    class="hidden"
    type="file"
    accept="*/*"
    onchange="handleAttachment(this)"
>


<script>

let selectedAttachment = null;


/* SIDEBAR */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* PLUS MENU */

function togglePlusMenu(){

    document
        .getElementById("plusMenu")
        .classList.toggle("open");

}


/* CLOSE PLUS MENU */

document.addEventListener("click",function(event){

    const menu =
        document.getElementById("plusMenu");

    const wrapper =
        document.querySelector(".plus-wrapper");

    if(
        menu &&
        wrapper &&
        !wrapper.contains(event.target)
    ){

        menu.classList.remove("open");

    }

});


/* NEW CHAT */

function newChat(){

    document.getElementById("chat").innerHTML = `

        <div class="welcome" id="welcome">

            <h1>RYXONGPT</h1>

            <p>
                What can I help you with?
            </p>

            <div class="suggestions">

                <button class="suggestion"
                    onclick="suggest('Give me a Roblox game idea')">
                    🎮 Roblox game idea
                </button>

                <button class="suggestion"
                    onclick="suggest('Help me create a website')">
                    🌐 Create a website
                </button>

                <button class="suggestion"
                    onclick="suggest('Give me a cool gaming name')">
                    👾 Gaming name
                </button>

                <button class="suggestion"
                    onclick="suggest('Give me YouTube Shorts ideas')">
                    📺 YouTube Shorts
                </button>

            </div>

        </div>
    `;

    selectedAttachment = null;

    document.getElementById(
        "attachmentPreview"
    ).innerHTML = "";

    document.getElementById(
        "messageInput"
    ).value = "";

}


/* SUGGESTION */

function suggest(text){

    document.getElementById(
        "messageInput"
    ).value = text;

    sendMessage();

}


/* CAMERA */

function openCamera(){

    closePlus();

    document
        .getElementById("cameraInput")
        .click();

}


/* PHOTO */

function openPhoto(){

    closePlus();

    document
        .getElementById("photoInput")
        .click();

}


/* FILE */

function openFile(){

    closePlus();

    document
        .getElementById("fileInput")
        .click();

}


/* PLUGINS */

function pluginsMessage(){

    closePlus();

    addMessage(
        "ai",
        "🔌 Plugins\n\nPlugins բաժինը կարող ենք միացնել արտաքին ծառայությունների հետ աշխատելու համար։"
    );

}


/* DEEP THINK */

function deepThink(){

    closePlus();

    addMessage(
        "ai",
        "🧠 Think deeper-ը միացված է որպես demo mode։\n\nՀարցդ գրիր, և RYXONGPT-ը կտա ավելի մանրամասն պատասխան։"
    );

}


/* CLOSE PLUS */

function closePlus(){

    document
        .getElementById("plusMenu")
        .classList.remove("open");

}


/* ATTACHMENT */

function handleAttachment(input){

    if(
        !input.files ||
        !input.files[0]
    ){
        return;
    }

    selectedAttachment =
        input.files[0];

    showAttachment(
        selectedAttachment
    );

    input.value = "";

}


/* SHOW ATTACHMENT */

function showAttachment(file){

    const preview =
        document.getElementById(
            "attachmentPreview"
        );

    preview.innerHTML = "";

    const card =
        document.createElement("div");

    card.className =
        "attachment-card";


    if(file.type.startsWith("image/")){

        const img =
            document.createElement("img");

        img.src =
            URL.createObjectURL(file);

        card.appendChild(img);

    }


    const info =
        document.createElement("div");

    info.className =
        "file-info";


    const name =
        document.createElement("div");

    name.className =
        "file-name";

    name.textContent =
        file.name;


    const type =
        document.createElement("div");

    type.className =
        "file-type";

    type.textContent =
        file.type || "File";


    info.appendChild(name);
    info.appendChild(type);


    const remove =
        document.createElement("button");

    remove.className =
        "remove-file";

    remove.textContent =
        "×";


    remove.onclick = function(){

        selectedAttachment = null;

        preview.innerHTML = "";

    };


    card.appendChild(info);
    card.appendChild(remove);

    preview.appendChild(card);

}


/* SEND MESSAGE */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();


    if(
        !text &&
        !selectedAttachment
    ){
        return;
    }


    const welcome =
        document.getElementById(
            "welcome"
        );

    if(welcome){
        welcome.remove();
    }


    const attachment =
        selectedAttachment;


    addMessage(
        "user",
        text,
        attachment
    );


    input.value = "";

    selectedAttachment = null;


    document.getElementById(
        "attachmentPreview"
    ).innerHTML = "";


    saveHistory(
        text || "Attachment"
    );


    showTyping();


    setTimeout(function(){

        removeTyping();


        const reply =
            generateReply(text);


        addMessage(
            "ai",
            reply
        );

    },900);

}


/* ADD MESSAGE */

function addMessage(
    type,
    text,
    attachment = null
){

    const chat =
        document.getElementById(
            "chat"
        );


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        type === "user"
            ? "U"
            : "R";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    if(text){

        bubble.textContent =
            text;

    }


    if(attachment){

        if(
            attachment.type.startsWith(
                "image/"
            )
        ){

            const img =
                document.createElement(
                    "img"
                );

            img.src =
                URL.createObjectURL(
                    attachment
                );

            img.style.maxWidth =
                "230px";

            img.style.maxHeight =
                "250px";

            img.style.borderRadius =
                "10px";

            img.style.display =
                "block";

            img.style.marginTop =
                text ? "10px" : "0";

            bubble.appendChild(img);

        }else{

            const fileBox =
                document.createElement(
                    "div"
                );

            fileBox.style.marginTop =
                text ? "10px" : "0";

            fileBox.textContent =
                "📎 " +
                attachment.name;

            bubble.appendChild(
                fileBox
            );

        }

    }


    message.appendChild(avatar);
    message.appendChild(bubble);


    if(type === "user"){

        message.innerHTML = "";

        message.appendChild(bubble);
        message.appendChild(avatar);

    }


    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

}


/* TYPING */

function showTyping(){

    const chat =
        document.getElementById(
            "chat"
        );


    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message ai";

    message.id =
        "typingMessage";


    message.innerHTML = `

        <div class="avatar">
            R
        </div>

        <div class="bubble">

            <div class="typing">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    `;


    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

}


/* REMOVE TYPING */

function removeTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if(typing){

        typing.remove();

    }

}


/* AI */

function generateReply(text){

    const t =
        (text || "")
        .toLowerCase();


    /* YOUTUBE */

    if(
        t.includes("youtube") ||
        t.includes("youtube-ի") ||
        t.includes("yt") ||
        t.includes("channel") ||
        t.includes("subscriber") ||
        t.includes("subscribers") ||
        t.includes("բաժանորդ")
    ){

        if(
            t.includes("short") ||
            t.includes("shorts")
        ){

            return `📺 YouTube Shorts-ի գաղափարներ.

🎮 Roblox gameplay
⚡ Funny gaming moment
🔥 Free Fire clutch
👀 Secret / tips
🏆 Challenge
💀 Fail → Win
🚀 Before / After

Եթե gaming channel ես անում, Shorts-ը կարող ես պահել կարճ, արագ և հետաքրքիր։`;

        }


        if(
            t.includes("name") ||
            t.includes("անուն")
        ){

            return `🔥 YouTube gaming անուններ.

RYXON
ONYX
VANTA
UMBRA
VOID
GRIM
VEIL
CRYPT

Կարող եմ նաև ստեղծել dark-style unique անուններ։`;

        }


        if(
            t.includes("subscriber") ||
            t.includes("բաժանորդ")
        ){

            return `📈 YouTube subscribers-ի համար.

• Կատարիր կարճ Shorts
• Առաջին վայրկյաններին հետաքրքիր պահ դիր
• Օգտագործիր պարզ վերնագիր
• Պահիր նույն gaming style-ը
• Վերբեռնիր կանոնավոր

Կարող եմ նաև քեզ համար կազմել 7-օրյա YouTube Shorts plan։`;

        }


        if(
            t.includes("title") ||
            t.includes("վերնագիր")
        ){

            return `🎬 YouTube title օրինակներ.

🔥 I Tried The Hardest Roblox Challenge
😱 Nobody Expected This...
💀 The Fastest Escape Ever
⚡ 1 HP Clutch!
👀 You Won't Believe What Happened`;

        }


        if(
            t.includes("hashtag") ||
            t.includes("հեշթեգ")
        ){

            return `🏷️ Gaming hashtags.

#Roblox
#RobloxGaming
#Gaming
#Shorts
#YouTubeShorts
#Gamer
#RYXON
#RobloxShorts`;

        }


        return `📺 Այո՛, RYXONGPT-ը կարող է օգնել YouTube-ի հարցերով։

Կարող ես հարցնել՝

🎬 Shorts-ի գաղափար
📈 Subscribers
🔥 Channel name
🏷️ Hashtags
✍️ Title
📝 Description
🎮 Gaming content

Գրիր կոնկրետ հարցդ։`;

    }


    /* ROBLOX */

    if(
        t.includes("roblox")
    ){

/* VOICE */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Voice input-ը այս browser-ում չի աջակցվում։"
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "hy-AM";

    recognition.interimResults =
        false;

    recognition.continuous =
        false;


    recognition.onstart =
        function(){

            document
                .getElementById(
                    "messageInput"
                )
                .placeholder =
                "Listening... 🎤";

        };


    recognition.onresult =
        function(event){

            const result =
                event.results[0][0]
                .transcript;


            document
                .getElementById(
                    "messageInput"
                )
                .value =
                result;

        };


    recognition.onend =
        function(){

            document
                .getElementById(
                    "messageInput"
                )
                .placeholder =
                "Message RYXONGPT...";

        };


    recognition.onerror =
        function(){

            document
                .getElementById(
                    "messageInput"
                )
                .placeholder =
                "Message RYXONGPT...";

        };


    recognition.start();

}


/* ENTER */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* HISTORY */

function saveHistory(text){

    if(!text){
        return;
    }


    const history =
        document.getElementById(
            "history"
        );


    const item =
        document.createElement(
            "div"
        );

    item.className =
        "history-item";


    let title = text;


    if(title.length > 32){

        title =
            title.substring(0,32)
            + "...";

    }


    item.textContent =
        "💬 " + title;


    item.onclick =
        function(){

            document
                .getElementById(
                    "messageInput"
                )
                .value =
                text;

        };


    history.prepend(item);

}


/* KEYBOARD SHORTCUT */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.ctrlKey &&
            event.key === "Enter"
        ){

            sendMessage();

        }

    }
);
