<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RYXONGPT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#09070d;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#100c18;
    border-right:1px solid #292033;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#b56cff;
    margin-bottom:15px;
}

.new-chat{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#7b2cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:15px;
}

.history{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
    padding:10px;
    margin-bottom:7px;
    background:#181220;
    border-radius:10px;
    cursor:pointer;
}

.chat-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    flex:1;
}

.delete-chat{
    background:none;
    border:none;
    color:#ff5d7d;
    font-size:17px;
    cursor:pointer;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:60px;
    border-bottom:1px solid #292033;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.brand{
    font-weight:bold;
    color:#c77dff;
}

.plus{
    border:1px solid #8f45ff;
    background:#1a1028;
    color:#d59aff;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
}

/* CHAT */
.chat{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

.welcome{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome h1{
    font-size:38px;
    color:#c77dff;
}

.welcome p{
    color:#aaa;
    margin-top:10px;
}

.message{
    display:flex;
    margin:14px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:80%;
    padding:12px 15px;
    border-radius:15px;
    white-space:pre-wrap;
    line-height:1.5;
}

.user .bubble{
    background:#7b2cff;
}

.ai .bubble{
    background:#18131f;
    border:1px solid #2b2237;
}

/* BOTTOM */
.bottom{
    padding:12px;
    border-top:1px solid #292033;
}

.attachment-preview{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:8px;
}

.preview{
    background:#21182c;
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
}

.input-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#151019;
    border:1px solid #30253b;
    border-radius:16px;
    padding:8px;
}

.input-box textarea{
    flex:1;
    resize:none;
    height:42px;
    background:none;
    border:none;
    outline:none;
    color:white;
    padding:10px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:10px;
    background:#21182c;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.send{
    background:#7b2cff;
}

/* PLUS MENU */
.menu{
    position:absolute;
    right:15px;
    top:65px;
    width:220px;
    background:#151019;
    border:1px solid #362747;
    border-radius:14px;
    padding:8px;
    display:none;
    z-index:20;
}

.menu button{
    width:100%;
    padding:12px;
    border:none;
    background:none;
    color:white;
    text-align:left;
    border-radius:9px;
    cursor:pointer;
}

.menu button:hover{
    background:#261b32;
}

/* TYPING */
.typing{
    color:#aaa;
    font-size:14px;
    padding:5px;
}

/* MOBILE */
@media(max-width:700px){
    .sidebar{
        width:70px;
        padding:8px;
    }

    .logo{
        font-size:14px;
        text-align:center;
    }

    .new-chat{
        font-size:0;
    }

    .new-chat::after{
        content:"＋";
        font-size:22px;
    }

    .chat-title{
        display:none;
    }

    .chat-item{
        justify-content:center;
    }

    .delete-chat{
        display:none;
    }

    .welcome h1{
        font-size:28px;
    }

    .chat{
        padding:15px;
    }

    .bubble{
        max-width:90%;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">RYXONGPT</div>

        <button class="new-chat" onclick="newChat()">
            New Chat
        </button>

        <div id="history" class="history"></div>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="brand">RYXONGPT</div>

            <button class="plus" onclick="toggleMenu()">
                ✦ RYXON Plus
            </button>

            <div id="menu" class="menu">

                <button onclick="openCamera()">
                    📷 Camera
                </button>

                <button onclick="openPhoto()">
                    🖼️ Photo
                </button>

                <button onclick="openFile()">
                    📁 Files
                </button>

                <button onclick="plugins()">
                    🧩 Plugins
                </button>

                <button onclick="thinkDeeper()">
                    🧠 Think deeper
                </button>

            </div>
        </header>

        <section id="chat" class="chat">

            <div id="welcome" class="welcome">
                <div>
                    <h1>RYXONGPT</h1>
                    <p>Ask me anything.</p>
                </div>
            </div>

        </section>

        <div class="bottom">

            <div id="attachmentPreview"
                 class="attachment-preview">
            </div>

            <div class="input-box">

                <button
                    class="icon-btn"
                    onclick="toggleMenu()">
                    ＋
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Message RYXONGPT..."
                    onkeydown="handleKey(event)">
                </textarea>

                <button
                    class="icon-btn"
                    onclick="startVoice()">
                    🎙️
                </button>

                <button
                    class="icon-btn send"
                    onclick="sendMessage()">
                    💬
                </button>

            </div>

        </div>

    </main>

</div>

<input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
>

<input
    id="fileInput"
    type="file"
    hidden
>

<script>

const BACKEND_URL =
"https://YOUR-BACKEND-DOMAIN.com";

let chats = JSON.parse(
    localStorage.getItem("ryxon_chats") || "[]"
);

let currentChat = [];

let selectedAttachment = null;


/* -------------------------
   MENU
------------------------- */

function toggleMenu(){

    const menu =
        document.getElementById("menu");

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";
}


/* -------------------------
   CAMERA
------------------------- */

function openCamera(){

    document
        .getElementById("photoInput")
        .click();

    toggleMenu();
}


/* -------------------------
   PHOTO
------------------------- */

function openPhoto(){

    const input =
        document.getElementById("photoInput");

    input.removeAttribute("capture");
    input.click();

    toggleMenu();
}


/* -------------------------
   FILE
------------------------- */

function openFile(){

    document
        .getElementById("fileInput")
        .click();

    toggleMenu();
}


/* -------------------------
   FILE SELECT
------------------------- */

document
    .getElementById("photoInput")
    .addEventListener("change", function(){

        if(!this.files.length) return;

        selectedAttachment =
            this.files[0];

        showAttachment(
            "🖼️ " +
            this.files[0].name
        );
    });


document
    .getElementById("fileInput")
    .addEventListener("change", function(){

        if(!this.files.length) return;

        selectedAttachment =
            this.files[0];

        showAttachment(
            "📁 " +
            this.files[0].name
        );
    });


function showAttachment(name){

    document
        .getElementById("attachmentPreview")
        .innerHTML =
        `<div class="preview">
            ${escapeHTML(name)}
         </div>`;
}


/* -------------------------
   SEND MESSAGE
------------------------- */

async function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text && !selectedAttachment){
        return;
    }

    const welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    let messageText = text;

    if(selectedAttachment){

        messageText +=
            (messageText ? "\n\n" : "") +
            "📎 Attached: " +
            selectedAttachment.name;
    }

    addMessage(
        "user",
        messageText
    );

    currentChat.push({
        role:"user",
        content:messageText
    });

    input.value = "";

    selectedAttachment = null;

    document
        .getElementById("attachmentPreview")
        .innerHTML = "";

    showTyping();

    try{

        const response =
            await fetch(
                BACKEND_URL + "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        messages:
                            currentChat
                    })
                }
            );

        const data =
            await response.json();

        removeTyping();

        if(!response.ok){

            addMessage(
                "ai",
                "❌ " +
                (data.error ||
                "Backend error")
            );

            return;
        }

        const reply =
            data.reply ||
            "Չկարողացա պատասխանել։";

        addMessage(
            "ai",
            reply
        );

        currentChat.push({
            role:"assistant",
            content:reply
        });

        saveCurrentChat();

    }catch(error){

        console.error(error);

        removeTyping();

        addMessage(
            "ai",
            "❌ AI-ի հետ կապը չստացվեց։\n\nՍտուգիր Backend URL-ը։"
        );
    }
}


/* -------------------------
   ADD MESSAGE
------------------------- */

function addMessage(type,text){

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* -------------------------
   TYPING
------------------------- */

function showTyping(){

    if(document.getElementById("typing")){
        return;
    }

    const chat =
        document.getElementById("chat");

    const typing =
        document.createElement("div");

    typing.id = "typing";

    typing.className =
        "typing";

    typing.textContent =
        "RYXONGPT is thinking...";

    chat.appendChild(typing);

    chat.scrollTop =
        chat.scrollHeight;
}


function removeTyping(){

    const typing =
        document.getElementById("typing");

    if(typing){
        typing.remove();
    }
}


/* -------------------------
   NEW CHAT
------------------------- */

function newChat(){

    if(currentChat.length){

        saveCurrentChat();
    }

    currentChat = [];

    document
        .getElementById("chat")
        .innerHTML = `
        <div id="welcome"
             class="welcome">
            <div>
                <h1>RYXONGPT</h1>
                <p>Ask me anything.</p>
            </div>
        </div>
    `;
}


/* -------------------------
   SAVE CHAT
------------------------- */

function saveCurrentChat(){

    if(!currentChat.length){
        return;
    }

    const firstUser =
        currentChat.find(
            x => x.role === "user"
        );

    if(!firstUser){
        return;
    }

    const title =
        firstUser.content
            .substring(0,35);

    const existing =
        chats.find(
            x => x.id === currentChat.id
        );

    if(existing){

        existing.messages =
            currentChat;

    }else{

        chats.unshift({
            id:Date.now(),
            title:title,
            messages:currentChat
        });
    }

    localStorage.setItem(
        "ryxon_chats",
        JSON.stringify(chats)
    );

    renderHistory();
}


/* -------------------------
   HISTORY
------------------------- */

function renderHistory(){

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            "chat-item";

        item.innerHTML = `
            <div class="chat-title">
                ${escapeHTML(chat.title)}
            </div>

            <button
                class="delete-chat"
                onclick="deleteChat(event,${chat.id})">
                ×
            </button>
        `;

        item.addEventListener(
            "click",
            function(){
                loadChat(chat.id);
            }
        );

        history.appendChild(item);
    });
}


/* -------------------------
   LOAD CHAT
------------------------- */

function loadChat(id){

    const chatData =
        chats.find(
            x => x.id === id
        );

    if(!chatData){
        return;
    }

    currentChat =
        chatData.messages.map(x => ({
            role:x.role,
            content:x.content
        }));

    const chat =
        document.getElementById("chat");

    chat.innerHTML = "";

    currentChat.forEach(message => {

        addMessage(
            message.role === "assistant"
            ? "ai"
            : "user",
            message.content
        );
    });
}


/* -------------------------
   DELETE CHAT
------------------------- */

function deleteChat(event,id){

    event.stopPropagation();

    chats =
        chats.filter(
            x => x.id !== id
        );

    localStorage.setItem(
        "ryxon_chats",
        JSON.stringify(chats)
    );

    renderHistory();
}


/* -------------------------
   VOICE
------------------------- */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice input-ը այս browser-ում հասանելի չէ։"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "hy-AM";

    recognition.interimResults = false;

    recognition.start();

    recognition.onresult =
        function(event){

            document
                .getElementById("messageInput")
                .value =
                event.results[0][0].transcript;
        };
}


/* -------------------------
   THINK DEEPER
------------------------- */

function thinkDeeper(){

    document
        .getElementById("messageInput")
        .value =
        "Think deeply about this: ";

    toggleMenu();
}


/* -------------------------
   PLUGINS
------------------------- */

function plugins(){

    alert(
        "Plugins section-ը կարող ենք միացնել backend plugins-ին։"
    );

    toggleMenu();
}


/* -------------------------
   ENTER
------------------------- */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();
    }
}


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* -------------------------
   START
------------------------- */

renderHistory();

</script>

</body>
</html>
