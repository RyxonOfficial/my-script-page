<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYXONGPT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#08080d;
  color:white;
  height:100vh;
  overflow:hidden;
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#0d0d14;
  border-right:1px solid #252533;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  padding:10px;
  background:linear-gradient(90deg,#9b5cff,#ff3b81);
  -webkit-background-clip:text;
  color:transparent;
}

.newchat{
  border:1px solid #353546;
  background:#171720;
  color:white;
  padding:13px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
}

.newchat:hover{
  background:#222230;
}

.history{
  color:#888;
  font-size:13px;
  padding:10px;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(circle at 50% 0%,#29104d 0%,transparent 35%),
    #08080d;
}

.topbar{
  height:60px;
  border-bottom:1px solid #252533;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.toplogo{
  font-weight:bold;
  letter-spacing:1px;
}

.status{
  font-size:12px;
  color:#a970ff;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 18%;
  padding-bottom:130px;
}

.welcome{
  text-align:center;
  margin-top:12vh;
}

.avatar{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  background:linear-gradient(135deg,#8b42ff,#ff3b81);
  box-shadow:0 0 40px #8b42ff55;
}

.welcome h1{
  margin-top:20px;
  font-size:34px;
}

.welcome p{
  color:#888;
  margin-top:8px;
}

.suggestions{
  margin:30px auto;
  max-width:600px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.suggestion{
  background:#11111a;
  border:1px solid #292938;
  padding:15px;
  border-radius:14px;
  color:#ddd;
  cursor:pointer;
}

.suggestion:hover{
  border-color:#8b42ff;
}

.message{
  display:flex;
  gap:12px;
  margin:25px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:75%;
  padding:14px 17px;
  border-radius:17px;
  line-height:1.5;
  white-space:pre-wrap;
}

.bot .bubble{
  background:#14141e;
  border:1px solid #282837;
}

.user .bubble{
  background:linear-gradient(135deg,#713cff,#a329ff);
}

.miniavatar{
  min-width:36px;
  height:36px;
  border-radius:12px;
  background:#252533;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* INPUT */
.inputarea{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:20px 18%;
  background:linear-gradient(transparent,#08080d 35%);
}

.inputbox{
  display:flex;
  align-items:center;
  gap:8px;
  background:#15151e;
  border:1px solid #353546;
  border-radius:18px;
  padding:8px;
  box-shadow:0 10px 40px #0008;
}

.inputbox textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
  padding:10px;
  height:42px;
  font-family:inherit;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#783cff,#d52dff);
  color:white;
  cursor:pointer;
  font-size:18px;
}

.voice{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:#252532;
  color:white;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .chat{
    padding:25px 12px 130px;
  }

  .inputarea{
    padding:12px;
  }

  .welcome h1{
    font-size:28px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .bubble{
    max-width:85%;
  }

}

/* TYPING */
.typing{
  display:flex;
  gap:5px;
  padding:5px;
}

.dot{
  width:7px;
  height:7px;
  background:#9b5cff;
  border-radius:50%;
  animation:blink 1s infinite;
}

.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">✦ RYXONGPT</div>

    <button class="newchat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history">
      CHAT HISTORY
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div class="toplogo">RYXONGPT</div>
      <div class="status">● ONLINE</div>
    </div>

    <div class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="avatar">✦</div>

        <h1>Welcome to RYXONGPT</h1>

        <p>Your personal AI assistant.</p>

        <div class="suggestions">

          <div class="suggestion"
               onclick="useSuggestion('Give me a cool Roblox game idea')">
            🎮 Roblox game idea
          </div>

          <div class="suggestion"
               onclick="useSuggestion('Give me a cool website idea')">
            🌐 Website idea
          </div>

          <div class="suggestion"
               onclick="useSuggestion('Help me with coding')">
            💻 Coding help
          </div>

          <div class="suggestion"
               onclick="useSuggestion('Give me a gaming name')">
            ⚡ Gaming name
          </div>

        </div>
      </div>

    </div>

    <div class="inputarea">

      <div class="inputbox">

        <button class="voice" onclick="voiceInput()">🎤</button>

        <textarea
          id="input"
          placeholder="Message RYXONGPT..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button class="send" onclick="sendMessage()">➤</button>

      </div>

    </div>

  </main>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

function handleKey(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function useSuggestion(text){
  input.value = text;
  sendMessage();
}

function addMessage(text,type){

  const message = document.createElement("div");
  message.className = "message " + type;

  if(type === "bot"){
    message.innerHTML = `
      <div class="miniavatar">✦</div>
      <div class="bubble">${escapeHTML(text)}</div>
    `;
  }else{
    message.innerHTML = `
      <div class="bubble">${escapeHTML(text)}</div>
    `;
  }

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){

  const typing = document.createElement("div");
  typing.className = "message bot";
  typing.id = "typing";

  typing.innerHTML = `
    <div class="miniavatar">✦</div>
    <div class="bubble">
      <div class="typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  `;

  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  welcome.style.display = "none";

  addMessage(text,"user");

  input.value = "";

  showTyping();

  setTimeout(()=>{

    const typing = document.getElementById("typing");

    if(typing) typing.remove();

    const reply = getReply(text);

    addMessage(reply,"bot");

  },900);
}

function getReply(text){

  const t = text.toLowerCase();

  if(t.includes("roblox")){
    return "🔥 Roblox-ի համար կարող ես սարքել Speed Rush, Escape կամ Combat game։ Եթե ուզես՝ կարող եմ քեզ ամբողջ system-ի գաղափարը և script-երը տալ։";
  }

  if(t.includes("website") || t.includes("կայք")){
    return "🌐 Կարանք սարքենք RYXON-ի սեփական gaming website՝ loading screen, animations, YouTube/TikTok buttons և dark neon design-ով։";
  }

  if(t.includes("coding") || t.includes("code") || t.includes("script")){
    return "💻 Ուղարկիր քո code-ը կամ ասա՝ ինչ system ես ուզում սարքել։ Ես կօգնեմ քայլ առ քայլ։";
  }

  if(t.includes("name")){
    return "⚡ Ահա մի քանի dark gaming անուն՝ RYXON, ONYX, VANTA, UMBRA, VOID, GRIM.";
  }

  return "✦ Ես RYXONGPT-ն եմ։ Քո հարցը հասկացա։ Կարող եմ օգնել Roblox-ի, coding-ի, website-ի և gaming գաղափարների հարցերով։";
}

function escapeHTML(text){

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function newChat(){

  chat.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="avatar">✦</div>

      <h1>Welcome to RYXONGPT</h1>

      <p>Your personal AI assistant.</p>

      <div class="suggestions">

        <div class="suggestion"
          onclick="useSuggestion('Give me a cool Roblox game idea')">
          🎮 Roblox game idea
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Give me a cool website idea')">
          🌐 Website idea
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Help me with coding')">
          💻 Coding help
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Give me a gaming name')">
          ⚡ Gaming name
        </div>

      </div>

    </div>
  `;

}

function voiceInput(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = function(event){

    input.value =
      event.results[0][0].transcript;

  };
}

</script>

</body>
</html>
